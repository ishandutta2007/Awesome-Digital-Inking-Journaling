<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .stroke-animation {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 6s ease-in-out infinite alternate;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .floating-card {
      animation: float 5s ease-in-out infinite alternate;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      100% { transform: scale(1.1) translate(-10px, 10px); opacity: 0.6; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#textGrad);
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic Background Graphics (Behind text) -->
  <g class="pulse-circle">
    <circle cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)" opacity="0.2"/>
    <circle cx="1050" cy="240" r="140" fill="#a855f7" filter="url(#glow)" opacity="0.2"/>
  </g>

  <!-- Dynamic Stylus Ink Strokes (Background Layer) -->
  <path class="stroke-animation" d="M 50,260 Q 350,290 600,240 T 1150,270" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.4"/>
  <path class="stroke-animation" d="M 100,40 Q 450,10 800,50 T 1100,30" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.3"/>

  <!-- Animated Accent Pills in Background Sides -->
  <g class="floating-card" opacity="0.25">
    <rect x="920" y="50" width="220" height="70" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 940,85 C 970,65 1000,105 1030,85 S 1090,75 1110,85" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Main Content Group (Foreground - Never Obscured) -->
  <g transform="translate(60, 0)">
    <!-- Icon / Visual Symbol -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="72" height="72" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
      <!-- Digital Pen & Paper Icon -->
      <path d="M 22 48 L 48 22 L 54 28 L 28 54 Z M 20 56 L 26 54 L 20 48 Z" fill="#38bdf8"/>
      <path d="M 44 18 L 50 12 L 60 22 L 54 28 Z" fill="#818cf8"/>
      <path d="M 16 20 L 36 20 M 16 28 L 30 28 M 16 36 L 24 36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="96" y="115" class="title-text" filter="url(#glow)">Awesome Digital Inking &amp; Journaling</text>
    <text x="96" y="152" class="subtitle-text">Curated List of Handwriting Recognition, PDF Annotation, Infinite Canvas &amp; Digital Journaling Apps</text>

    <!-- Feature Tag Badges (Foreground) -->
    <g transform="translate(96, 185)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="18" y="22" class="badge-text">✍️ Vector Inking</text>

      <!-- Badge 2 -->
      <rect x="177" y="0" width="195" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="195" y="22" class="badge-text">🔍 AI Recognition</text>

      <!-- Badge 3 -->
      <rect x="384" y="0" width="175" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="402" y="22" class="badge-text">🎨 Infinite Canvas</text>

      <!-- Badge 4 -->
      <rect x="571" y="0" width="175" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="589" y="22" class="badge-text">📄 PDF Markup</text>
    </g>

    <!-- Bottom Metadata / Highlights Line -->
    <text x="96" y="255" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500">
      ⚡ Featuring Xournal++, GoodNotes, Excalidraw, tldraw, Rnote, Joplin, Saber, Nebo, Concepts &amp; More
    </text>
  </g>
</svg>
