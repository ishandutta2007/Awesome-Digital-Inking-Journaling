ion" opacity=".3"/><g class="floating-card" opacity=".25"><rect width="220" height="70" x="920" y="50" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="12"/><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 940,85 C 970,65 1000,105 1030,85 S 1090,75 1110,85"/></g><g><g transform="translate(60, 0) translate(0, 75)"><rect width="72" height="72" x="0" y="0" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#glow)" rx="16"/><path fill="#38bdf8" d="M 22 48 L 48 22 L 54 28 L 28 54 Z M 20 56 L 26 54 L 20 48 Z"/><path fill="#818cf8" d="M 44 18 L 50 12 L 60 22 L 54 28 Z"/><path stroke="#94a3b8" stroke-linecap="round" stroke-width="2" d="M 16 20 L 36 20 M 16 28 L 30 28 M 16 36 L 24 36"/></g><text x="96" y="115" class="title-text" filter="url(#glow)" transform="translate(60, 0)">Awesome Digital Inking &amp; Journaling</text><text x="96" y="152" class="subtitle-text" transform="translate(60, 0)">Curated List of Handwriting Recognition, PDF Annotation, Infinite Canvas &amp; Digital Journaling Apps</text><g transform="translate(60, 0) translate(96, 185)"><rect width="165" height="34" x="0" y="0" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" rx="17"/><text x="18" y="22" class="badge-text">✍️ Vector Inking</text><rect width="195" height="34" x="177" y="0" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" rx="17"/><text x="195" y="22" class="badge-text">🔍 AI Recognition</text><rect width="175" height="34" x="384" y="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" rx="17"/><text x="402" y="22" class="badge-text">🎨 Infinite Canvas</text><rect width="175" height="34" x="571" y="0" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="17"/><text x="589" y="22" class="badge-text">📄 PDF Markup</text></g><text x="96" y="255" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" transform="translate(60, 0)">⚡ Featuring Xournal++, GoodNotes, Excalidraw, tldraw, Rnote, Joplin, Saber, Nebo, Concepts &amp; More</text